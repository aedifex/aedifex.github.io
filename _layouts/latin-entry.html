---
layout: base
---

{% include header.html type="post" %}

<main class="container-md">
  <div class="row">
    <div class="col-xl-8 offset-xl-2 col-lg-10 offset-lg-1">

      {% if page.source %}
        <p class="latin-source">Source: <cite>{{ page.source }}</cite></p>
      {% endif %}

      <div class="blog-post latin-entry">
        {{ content }}
      </div>

      {% if page.social-share %}
        {% include social-share.html %}
      {% endif %}

      <p class="latin-back">
        <a href="{{ '/latin/' | relative_url }}"><i class="fas fa-arrow-left"></i> Back to Latin</a>
      </p>
    </div>
  </div>
</main>
